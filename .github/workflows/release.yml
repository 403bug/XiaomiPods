name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager > /dev/null 2>&1; then
            SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)")"
            echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
            export PATH="$SDKMANAGER_DIR:$PATH"
          fi
          yes | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          XIAOMIPODS_KEYSTORE: ${{ runner.temp }}/release.jks
          XIAOMIPODS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          XIAOMIPODS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          XIAOMIPODS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="XiaomiPods-for-ColorOS-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="XiaomiPods-for-ColorOS-${TAG}.apk"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "$TAG" --generate-notes
          fi
